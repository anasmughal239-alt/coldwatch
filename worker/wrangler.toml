name = "coldwatch-web"
main = "src/index.ts"
compatibility_date = "2025-01-15"
workers_dev = true

[vars]
# Where the "Join the waitlist" button points (Tally, Formspree, a Google Form).
# Override at deploy: npx wrangler deploy --var WAITLIST_URL:https://tally.so/r/xxxx
WAITLIST_URL = ""
# Domains checked per cron fire. 8 ~= 24 DNS subrequests, well under the
# free-plan cap of 50.
CRON_BATCH_LIMIT = "8"
# Self-imposed daily Spamhaus DQS query ceiling (keep below the real free-tier
# limit). Blacklist checks degrade to "unknown" once this is hit.
DQS_DAILY_CEILING = "200000"

# Cron trigger for the scheduler (scheduled() handler). Every 10 minutes.
[triggers]
crons = ["*/10 * * * *"]

# D1 database. Create it once, then paste the id:
#   npx wrangler d1 create coldwatch
#   npx wrangler d1 migrations apply coldwatch --local     # for `wrangler dev`
#   npx wrangler d1 migrations apply coldwatch --remote    # for production
[[d1_databases]]
binding = "DB"
database_name = "coldwatch"
database_id = "REPLACE_WITH_ID_FROM_d1_create"

# Secrets — set with `npx wrangler secret put <NAME>`, never as plain vars:
#   CW_ADMIN_TOKEN   bearer token for the /api/domains admin API
#   DQS_KEY          free Spamhaus Data Query Service key; without it the
#                    scheduler runs DNS-auth checks only (no blacklist stage)
#
# Optional: KV namespace to capture waitlist emails posted to /api/waitlist:
#   npx wrangler kv namespace create WAITLIST
# [[kv_namespaces]]
# binding = "WAITLIST"
# id = "<id from the command above>"
